name: CI/CD — Elysian Flee

on:
  push:
    branches: ["**"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/elysian-flee-api

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — Tests backend Go
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  backend:
    name: 🔧 Backend — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p2p_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p2p_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🐹 Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: 📦 Download dependencies
        run: go mod download

      - name: 🔍 Vet
        run: go vet ./...

      - name: 🧪 Unit tests (MemoryStore)
        run: go test ./... -v -count=1 -race -timeout 60s
        env:
          ALLOW_INSECURE_DEV: "true"
          OTP_DEV_MODE: "true"
          JWT_SECRET: "ci-test-secret-not-for-production"

      - name: 🗄️  Integration tests (PostgreSQL)
        run: go test ./... -v -count=1 -timeout 120s -tags integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/p2p_test?sslmode=disable
          ALLOW_INSECURE_DEV: "true"
          OTP_DEV_MODE: "true"
          JWT_SECRET: "ci-test-secret-not-for-production"

      - name: 🏗️  Build binaire
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w -X main.Version=$GITHUB_SHA" \
          -o /tmp/api ./cmd/api
          echo "✅ Build OK — $(du -sh /tmp/api | cut -f1)"

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Lint & Tests Flutter
  # ══════════════════════════════════════════════════════════════════════════════
  mobile:
    name: 📱 Mobile — Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a7483daf7b4d6 # v2.18.0
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      - name: 📦 Flutter pub get
        run: flutter pub get

      - name: 🔍 Flutter analyze
        # --fatal-warnings bloque sur warnings et erreurs, pas sur les infos cosmétiques
        run: flutter analyze --fatal-warnings

      - name: 🧪 Flutter test
        run: flutter test --coverage

      - name: 📊 Coverage report
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "### 📊 Flutter Coverage" >> $GITHUB_STEP_SUMMARY
            LINES=$(grep -c "^DA:" coverage/lcov.info 2>/dev/null || echo 0)
            COVERED=$(grep -c "^DA:[0-9]*,[^0]" coverage/lcov.info 2>/dev/null || echo 0)
            echo "- Lignes instrumentées : $LINES" >> $GITHUB_STEP_SUMMARY
            echo "- Lignes couvertes     : $COVERED" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Pas de fichier coverage/lcov.info généré" >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Docker Build & Push (main/master uniquement)
  # ══════════════════════════════════════════════════════════════════════════════
  docker:
    name: 🐳 Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️  Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea8a986b47c609bc2f8b553571 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: 🏗️  Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd2f61d51a572a76f47d4a82a42a5c # v3.10.0

      - name: 🐳 Build & Push image
        id: push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: 📋 Image summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "### 🐳 Docker Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: $IMAGE_TAGS" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: $IMAGE_DIGEST" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 4 — Build APK Flutter release
  # ══════════════════════════════════════════════════════════════════════════════
  apk:
    name: 📦 APK — Flutter Release Build
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a7483daf7b4d6 # v2.18.0
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      - name: ☕ Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71c4e7bc9ada1a # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: 🔑 Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release-keystore.jks
            echo "✅ Keystore decoded"
          else
            echo "⚠️  No keystore — building unsigned APK"
          fi

      - name: 📝 Créer key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEY_ALIAS" ]; then
            cat > mobile/android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
            echo "✅ key.properties created"
          fi

      - name: 📦 Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: 🔨 Build APK release
        working-directory: mobile
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          flutter build apk --release \
            --target=lib/main.dart \
            --dart-define=API_BASE_URL=${API_BASE_URL:-https://api.elysian-flee.com}
          echo "✅ APK built"
          ls -lh build/app/outputs/flutter-apk/

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elysian-flee-${{ github.sha }}.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📋 APK summary
        run: |
          APK_SIZE=$(du -sh mobile/build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "### 📦 APK Built" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Download**: voir Artifacts ci-dessus" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 5 — Déploiement SSH sur le serveur
  # ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy — Production Server
    runs-on: ubuntu-latest
    needs: [docker, apk]
    # Render déploie automatiquement depuis GitHub — job SSH désactivé
    if: false

    environment:
      name: production
      url: https://api.elysian-flee.com

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🔑 Setup SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 🌐 Known hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 📋 Test connexion SSH
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "echo '✅ SSH OK'"

      - name: 📤 Copier docker-compose
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp deploy/docker-compose.external-test.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/app/elysian-flee/docker-compose.yml"

      - name: 🔑 Login Docker sur le serveur
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_URL: ${{ env.REGISTRY }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo $REGISTRY_TOKEN | docker login $REGISTRY_URL -u $REGISTRY_USER --password-stdin"

      - name: 🚀 Déployer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash << ENDSSH
            set -e
            cd /app/elysian-flee
            echo "🔄 Pull image..."
            docker pull "$FULL_IMAGE"
            echo "🔄 Restart API..."
            docker compose up -d --no-deps --pull always api
            echo "⏳ Attente démarrage (30s)..."
            sleep 30
            echo "🏥 Health check..."
            curl -sf http://localhost:8081/healthz || (echo "❌ FAILED" && exit 1)
            echo "🧹 Cleanup..."
            docker image prune -f
            echo "✅ Déploiement OK"
          ENDSSH

      - name: ✅ Vérification HTTPS post-déploiement
        run: |
          sleep 10
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://api.elysian-flee.com/healthz || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Production OK (HTTP $HTTP_CODE)"
          else
            echo "❌ Production FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: 📋 Résumé déploiement
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          SERVER: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "### 🚀 Déploiement Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`$COMMIT_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Heure**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Par**: @$ACTOR" >> $GITHUB_STEP_SUMMARY

      - name: 🔔 Slack si échec
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8ffa605d0767df6d3cc1d47bbd40f71 # v1.27.0
        with:
          payload: |
            {
              "text": "❌ *Deploy FAILED* — Elysian Flee"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
